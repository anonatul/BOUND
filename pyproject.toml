[project]
name = "forensic-doc-attribution"
version = "0.1.0"
description = "Offline Post-Quantum Forensic Document Attribution Prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pqcrypto>=1.0.0",
    "cryptography>=42.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "reportlab>=4.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
